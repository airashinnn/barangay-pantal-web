<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - BRIS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>
:root {
    --primary: #1a4d2e;
    --primary-light: #2d6a4f;
    --primary-dark: #0f2818;
    --accent: #f59e0b;
    --bg-light: #fafaf9;
    --bg-white: #ffffff;
    --text-dark: #1c1917;
    --text-gray: #57534e;
    --border: #e7e5e4;
    --shadow: rgba(26, 77, 46, 0.1);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: 'Outfit', sans-serif;
    background: linear-gradient(135deg, var(--bg-light) 0%, #e7f5ec 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}
.container {
    width: 100%;
    max-width: 1000px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    background: var(--bg-white);
    border-radius: 24px;
    overflow: hidden;
    box-shadow: 0 20px 60px var(--shadow);
}
.left-panel {
    background: linear-gradient(165deg, var(--primary) 0%, var(--primary-dark) 100%);
    padding: 60px;
    color: white;
    display: flex;
    flex-direction: column;
    justify-content: center;
}
.brand h1 {
    font-family: 'DM Serif Display', serif;
    font-size: 32px;
    margin-bottom: 10px;
}
.right-panel {
    padding: 60px;
    display: flex;
    flex-direction: column;
    justify-content: center;
}
.login-header { margin-bottom: 30px; }
.login-header h2 {
    font-family: 'DM Serif Display', serif;
    font-size: 28px;
    color: var(--text-dark);
}
.form-group { margin-bottom: 20px; }
.form-group label {
    display: block;
    font-weight: 600;
    margin-bottom: 8px;
    font-size: 14px;
}
.input-wrapper input {
    width: 100%;
    padding: 12px 16px;
    border: 2px solid var(--border);
    border-radius: 12px;
    font-family: 'Outfit', sans-serif;
}
.btn-login {
    width: 100%;
    padding: 16px;
    background: var(--primary);
    color: white;
    border: none;
    border-radius: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: 0.3s;
}
.btn-login:hover {
    background: var(--primary-light);
    transform: translateY(-2px);
}
.switch-page {
    text-align: center;
    margin-top: 20px;
    font-size: 14px;
    color: var(--text-gray);
}
.switch-page a {
    color: var(--primary);
    font-weight: 600;
    text-decoration: none;
}
.alert {
    padding: 12px;
    border-radius: 8px;
    margin-bottom: 20px;
    display: none;
    font-size: 14px;
}
.error { background: #fee2e2; color: #991b1b; }
.success { background: #dcfce7; color: #166534; }
@media (max-width: 768px) {
    .container { grid-template-columns: 1fr; }
    .left-panel { display: none; }
}
</style>
</head>
<body>
<div class="container">
    <div class="left-panel">
        <div class="brand">
            <h1>BRIS</h1>
            <p>Barangay Resident Information System</p>
        </div>
    </div>
    <div class="right-panel">
        <div class="login-header">
            <h2>Welcome Back</h2>
            <p>Sign in to your account</p>
        </div>
        <div id="alertBox" class="alert"></div>
        <form id="loginForm">
            <div class="form-group">
                <label>Email Address</label>
                <div class="input-wrapper">
                    <input type="email" id="email" placeholder="admin@barangay.gov.ph" required>
                </div>
            </div>
            <div class="form-group">
                <label>Password</label>
                <div class="input-wrapper">
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>
            </div>
            <button type="submit" class="btn-login">Sign In</button>
        </form>
        <p class="switch-page">
            Don't have an account? <a href="signup.html">Create Account</a>
        </p>
    </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore, doc, getDoc } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

const firebaseConfig = {
  apiKey: "AIzaSyCKjUzCvZBVfSFTnmJ8QXJcL7nNVlPiH3g",
  authDomain: "bris-ae04d.firebaseapp.com",
  projectId: "bris-ae04d",
  storageBucket: "bris-ae04d.firebasestorage.app",
  messagingSenderId: "626608470273",
  appId: "1:626608470273:web:c33211ca2edb33465dc300",
  measurementId: "G-WFNQCMHVBW"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const alertBox = document.getElementById('alertBox');
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;

    try {
        const userCredential = await signInWithEmailAndPassword(auth, email, password);
        const user = userCredential.user;

        const userDoc = await getDoc(doc(db, "users", user.uid));
        
        if (userDoc.exists()) {
            const userData = userDoc.data();
            
            localStorage.setItem('userRole', userData.role);
            localStorage.setItem('userEmail', userData.email);
            localStorage.setItem('userId', user.uid);
            localStorage.setItem('userName', userData.name || userData.email.split('@')[0]);

            alertBox.textContent = "Login successful! Redirecting...";
            alertBox.className = "alert success";
            alertBox.style.display = "block";

            setTimeout(() => {
                const role = userData.role;
                if (role === 'Resident') {
                    window.location.href = 'dashboard_resident.html';
                } else if (role === 'Barangay_Official') {
                    window.location.href = 'dashboard_official.html';
                } else if (role === 'Barangay_Captain' || role === 'Barangay_Secretary') {
                    window.location.href = 'dashboard.html';
                } else {
                    window.location.href = 'dashboard.html';
                }
            }, 1000);
        } else {
            alertBox.textContent = "Error: User record not found in database.";
            alertBox.className = "alert error";
            alertBox.style.display = "block";
        }
    } catch (error) {
        console.error(error);
        alertBox.textContent = "Login failed: " + error.message;
        alertBox.className = "alert error";
        alertBox.style.display = "block";
    }
});
</script>
</body>
</html>
