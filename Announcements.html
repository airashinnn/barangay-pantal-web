<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Announcements - BRIS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #1a4d2e;
            --primary-light: #2d6a4f;
            --primary-dark: #0f2818;
            --accent: #f59e0b;
            --bg-light: #fafaf9;
            --bg-white: #ffffff;
            --text-dark: #1c1917;
            --text-gray: #57534e;
            --border: #e7e5e4;
            --shadow: rgba(26, 77, 46, 0.1);
            --danger: #dc2626;
            --success: #16a34a;
            --info: #2563eb;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Outfit', sans-serif; background: var(--bg-light); color: var(--text-dark); }
        .app-container { display: flex; min-height: 100vh; }
        
        /* Sidebar */
        .sidebar { width: 280px; background: linear-gradient(165deg, var(--primary) 0%, var(--primary-dark) 100%); padding: 30px 0; position: fixed; height: 100vh; overflow-y: auto; box-shadow: 4px 0 12px var(--shadow); z-index: 100; }
        .sidebar-brand { padding: 0 30px 30px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .sidebar-logo { display: flex; align-items: center; gap: 12px; }
        .logo-icon { width: 48px; height: 48px; background: var(--accent); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-family: 'DM Serif Display', serif; font-size: 24px; color: var(--primary-dark); font-weight: 700; }
        .logo-text h2 { font-family: 'DM Serif Display', serif; font-size: 20px; color: #fff; margin-bottom: 2px; }
        .logo-text p { font-size: 11px; color: rgba(255,255,255,0.6); letter-spacing: 0.5px; }
        .sidebar-nav { padding: 20px 0; }
        .nav-section { margin-bottom: 24px; }
        .nav-section-title { font-size: 11px; color: rgba(255,255,255,0.5); font-weight: 600; text-transform: uppercase; letter-spacing: 1px; padding: 0 30px; margin-bottom: 8px; }
        .nav-item { display: flex; align-items: center; gap: 12px; padding: 12px 30px; color: rgba(255,255,255,0.8); text-decoration: none; transition: all 0.3s ease; position: relative; font-size: 15px; cursor: pointer; }
        .nav-item:hover { background: rgba(255,255,255,0.05); color: #fff; }
        .nav-item.active { background: rgba(245,158,11,0.15); color: var(--accent); }
        .nav-item.active::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--accent); }
        .nav-icon { width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; }
        
        /* Main Content */
        .main-content { flex: 1; margin-left: 280px; transition: margin-left 0.3s ease; }
        .topbar { background: var(--bg-white); padding: 20px 40px; box-shadow: 0 2px 8px var(--shadow); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 90; }
        .topbar-left h1 { font-family: 'DM Serif Display', serif; font-size: 28px; color: var(--text-dark); }
        .topbar-left p { color: var(--text-gray); font-size: 14px; margin-top: 4px; }
        .topbar-right { display: flex; align-items: center; gap: 16px; }
        .btn-primary { padding: 12px 24px; background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%); color: var(--bg-white); border: none; border-radius: 10px; font-family: 'Outfit', sans-serif; font-size: 14px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 8px; transition: all 0.3s ease; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(26,77,46,0.3); }
        .content { padding: 40px; }
        
        /* Announcements Grid */
        .announcements-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(400px, 1fr)); gap: 24px; }
        .announcement-card { background: var(--bg-white); border-radius: 16px; padding: 24px; box-shadow: 0 4px 12px var(--shadow); transition: all 0.3s ease; position: relative; overflow: hidden; }
        .announcement-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px; background: linear-gradient(90deg, var(--primary) 0%, var(--accent) 100%); }
        .announcement-card:hover { transform: translateY(-4px); box-shadow: 0 8px 24px var(--shadow); }
        .announcement-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 16px; }
        .announcement-type { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; }
        .announcement-type.info { background: rgba(37,99,235,0.1); color: var(--info); }
        .announcement-type.warning { background: rgba(245,158,11,0.1); color: var(--accent); }
        .announcement-type.urgent { background: rgba(220,38,38,0.1); color: var(--danger); }
        .announcement-type.success { background: rgba(22,163,74,0.1); color: var(--success); }
        .announcement-actions { display: flex; gap: 8px; }
        .btn-icon { width: 32px; height: 32px; border: none; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.3s ease; background: var(--bg-light); }
        .btn-icon:hover { transform: scale(1.1); }
        .btn-icon.edit { color: var(--accent); }
        .btn-icon.edit:hover { background: var(--accent); color: white; }
        .btn-icon.delete { color: var(--danger); }
        .btn-icon.delete:hover { background: var(--danger); color: white; }
        .announcement-title { font-size: 20px; font-weight: 700; color: var(--text-dark); margin-bottom: 12px; }
        .announcement-content { color: var(--text-gray); line-height: 1.6; margin-bottom: 16px; }
        .announcement-footer { display: flex; justify-content: space-between; align-items: center; padding-top: 16px; border-top: 1px solid var(--border); }
        .announcement-date { font-size: 12px; color: var(--text-gray); display: flex; align-items: center; gap: 6px; }
        .announcement-status { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; }
        .announcement-status.active { background: rgba(22,163,74,0.1); color: var(--success); }
        .announcement-status.expired { background: rgba(107,114,128,0.1); color: #6b7280; }
        
        /* Modal */
        .modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center; padding: 20px; }
        .modal.active { display: flex; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .modal-content { background: var(--bg-white); border-radius: 20px; width: 100%; max-width: 700px; max-height: 90vh; overflow-y: auto; animation: slideUp 0.3s ease; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        .modal-header { padding: 24px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .modal-header h2 { font-family: 'DM Serif Display', serif; font-size: 24px; color: var(--text-dark); }
        .btn-close { width: 32px; height: 32px; border: none; background: var(--bg-light); border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.3s ease; }
        .btn-close:hover { background: var(--border); }
        .modal-body { padding: 24px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 14px; font-weight: 600; color: var(--text-dark); margin-bottom: 8px; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 12px 16px; border: 2px solid var(--border); border-radius: 10px; font-family: 'Outfit', sans-serif; font-size: 14px; transition: all 0.3s ease; }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 4px rgba(26,77,46,0.1); }
        .form-group textarea { resize: vertical; min-height: 120px; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .modal-footer { padding: 24px; border-top: 1px solid var(--border); display: flex; gap: 12px; justify-content: flex-end; }
        .btn-secondary { padding: 12px 24px; background: var(--bg-light); color: var(--text-dark); border: none; border-radius: 10px; font-family: 'Outfit', sans-serif; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.3s ease; }
        .btn-secondary:hover { background: var(--border); }
        
        /* Empty State */
        .empty-state { text-align: center; padding: 60px 20px; background: var(--bg-white); border-radius: 16px; grid-column: 1/-1; }
        .empty-state i { font-size: 80px; color: var(--text-gray); margin-bottom: 20px; }
        .empty-state h3 { font-size: 20px; color: var(--text-dark); margin-bottom: 8px; }
        .empty-state p { color: var(--text-gray); font-size: 14px; }
        
        /* Loading */
        .loading { display: flex; justify-content: center; align-items: center; padding: 40px; }
        .loading-spinner { width: 40px; height: 40px; border: 4px solid var(--border); border-top: 4px solid var(--primary); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        /* Responsive */
        @media (max-width: 768px) {
            .sidebar { transform: translateX(-100%); }
            .main-content { margin-left: 0; }
            .announcements-grid { grid-template-columns: 1fr; }
            .form-row { grid-template-columns: 1fr; }
            .content { padding: 20px; }
            .topbar { padding: 16px 20px; flex-direction: column; gap: 16px; align-items: flex-start; }
            .topbar-right { width: 100%; justify-content: flex-end; }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-brand">
                <div class="sidebar-logo">
                    <div class="logo-icon">B</div>
                    <div class="logo-text">
                        <h2 id="sideBrandTitle">BRIS</h2>
                        <p id="sideBrandRole">ADMIN PANEL</p>
                    </div>
                </div>
            </div>
            <nav class="sidebar-nav">
                <div class="nav-section">
                    <div class="nav-section-title">Main</div>
                    <a href="dashboard.html" class="nav-item">
                        <div class="nav-icon"><i class="fas fa-home"></i></div>
                        Dashboard
                    </a>
                    <a href="Announcements.html" class="nav-item active">
                        <div class="nav-icon"><i class="fas fa-bullhorn"></i></div>
                        Announcements
                    </a>
                    <a href="residents.html" class="nav-item">
                        <div class="nav-icon"><i class="fas fa-users"></i></div>
                        Residents
                    </a>
                    <a href="households.html" class="nav-item">
                        <div class="nav-icon"><i class="fas fa-house-user"></i></div>
                        Households
                    </a>
                </div>
                <div class="nav-section">
                    <div class="nav-section-title">Reports</div>
                    <a href="reports.html" class="nav-item">
                        <div class="nav-icon"><i class="fas fa-chart-bar"></i></div>
                        Analytics
                    </a>
                    <a href="#" class="nav-item">
                        <div class="nav-icon"><i class="fas fa-file-export"></i></div>
                        Export Data
                    </a>
                </div>
                <div class="nav-section">
                    <div class="nav-section-title">Settings</div>
                    <a href="settings.html" class="nav-item">
                        <div class="nav-icon"><i class="fas fa-cog"></i></div>
                        Settings
                    </a>
                </div>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Topbar -->
            <div class="topbar">
                <div class="topbar-left">
                    <h1>Announcements</h1>
                    <p id="welcomeMsg">Manage all announcements here</p>
                </div>
                <div class="topbar-right">
                    <button class="btn-primary" onclick="openModal()">
                        <i class="fas fa-plus"></i> New Announcement
                    </button>
                </div>
            </div>

            <!-- Content -->
            <div class="content">
                <div class="announcements-grid" id="announcementsGrid">
                    <div class="loading">
                        <div class="loading-spinner"></div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Add/Edit Modal -->
    <div class="modal" id="announcementModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">New Announcement</h2>
                <button class="btn-close" onclick="closeModal()">&times;</button>
            </div>
            <form id="announcementForm">
                <div class="modal-body">
                    <input type="hidden" id="announcementId">
                    <div class="form-group">
                        <label>Title *</label>
                        <input type="text" id="title" placeholder="Enter announcement title" required>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Type *</label>
                            <select id="type" required>
                                <option value="info">Information</option>
                                <option value="warning">Warning</option>
                                <option value="urgent">Urgent</option>
                                <option value="success">Success</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Status *</label>
                            <select id="status" required>
                                <option value="active">Active</option>
                                <option value="expired">Expired</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Start Date *</label>
                            <input type="date" id="startDate" required>
                        </div>
                        <div class="form-group">
                            <label>End Date *</label>
                            <input type="date" id="endDate" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Content *</label>
                        <textarea id="content" placeholder="Enter announcement content" required></textarea>
                    </div>
                    <div class="form-group">
                        <label>Target Audience</label>
                        <select id="audience" multiple>
                            <option value="all">All Residents</option>
                            <option value="senior">Senior Citizens</option>
                            <option value="pwd">PWD</option>
                            <option value="voters">Registered Voters</option>
                            <option value="officials">Officials Only</option>
                        </select>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn-secondary" onclick="closeModal()">Cancel</button>
                    <button type="submit" class="btn-primary">Save Announcement</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Firebase and Script -->
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getAuth, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';
        import { 
            getFirestore, 
            collection, 
            addDoc, 
            updateDoc, 
            deleteDoc, 
            doc, 
            getDocs, 
            query, 
            orderBy,
            Timestamp 
        } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

        const firebaseConfig = {
            apiKey: "AIzaSyCKjUzCvZBVfSFTnmJ8QXJcL7nNVlPiH3g",
            authDomain: "bris-ae04d.firebaseapp.com",
            projectId: "bris-ae04d",
            storageBucket: "bris-ae04d.firebasestorage.app",
            messagingSenderId: "626608470273",
            appId: "1:626608470273:web:c33211ca2edb33465dc300",
            measurementId: "G-WFNQCMHVBW"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentAnnouncementId = null;
        let announcements = [];

        // Auth Check
        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                window.location.href = 'index.html';
                return;
            }
            
            // Update UI based on role
            const userRole = localStorage.getItem('userRole');
            const userEmail = localStorage.getItem('userEmail') || 'User';
            
            if (userRole === 'Resident') {
                document.getElementById('sideBrandRole').innerText = 'RESIDENT PORTAL';
                document.getElementById('welcomeMsg').innerText = 'View latest updates from your Barangay.';
                // Hide create button for residents
                document.querySelector('.btn-primary').style.display = 'none';
            }
            
            // Update user info
            document.getElementById('displayUserName').textContent = userEmail.split('@')[0];
            document.getElementById('displayUserRole').textContent = userRole;
            document.getElementById('avatarChar').textContent = userEmail.charAt(0).toUpperCase();
            
            // Hide restricted menu items for residents
            if (userRole === 'Resident') {
                document.querySelectorAll('.nav-item').forEach(nav => {
                    const text = nav.textContent.toLowerCase();
                    if (text.includes('residents') || text.includes('households') || 
                        text.includes('analytics') || text.includes('export')) {
                        nav.style.display = 'none';
                    }
                });
            }
            
            loadAnnouncements();
        });

        // Load Announcements from Firebase
        async function loadAnnouncements() {
            try {
                const grid = document.getElementById('announcementsGrid');
                grid.innerHTML = '<div class="loading"><div class="loading-spinner"></div></div>';
                
                const q = query(collection(db, 'announcements'), orderBy('startDate', 'desc'));
                const querySnapshot = await getDocs(q);
                
                announcements = [];
                querySnapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    announcements.push({
                        id: docSnap.id,
                        ...data,
                        startDate: data.startDate?.toDate ? data.startDate.toDate() : new Date(data.startDate),
                        endDate: data.endDate?.toDate ? data.endDate.toDate() : new Date(data.endDate)
                    });
                });
                
                displayAnnouncements(announcements);
            } catch (error) {
                console.error('Error loading announcements:', error);
                showError('Failed to load announcements');
            }
        }

        // Display Announcements
        function displayAnnouncements(data) {
            const grid = document.getElementById('announcementsGrid');
            
            if (data.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-bullhorn"></i>
                        <h3>No announcements found</h3>
                        <p>Create your first announcement to share with the community</p>
                        <button class="btn-primary" style="margin-top: 20px;" onclick="openModal()">
                            <i class="fas fa-plus"></i> Create Announcement
                        </button>
                    </div>
                `;
                return;
            }
            
            grid.innerHTML = data.map(announcement => {
                const now = new Date();
                const isActive = now >= announcement.startDate && now <= announcement.endDate;
                const statusClass = isActive ? 'active' : 'expired';
                const statusText = isActive ? 'Active' : 'Expired';
                
                const typeClass = announcement.type || 'info';
                const typeText = announcement.type ? announcement.type.charAt(0).toUpperCase() + announcement.type.slice(1) : 'Information';
                
                return `
                    <div class="announcement-card">
                        <div class="announcement-header">
                            <span class="announcement-type ${typeClass}">
                                <i class="fas fa-${getTypeIcon(announcement.type)}"></i>
                                ${typeText}
                            </span>
                            <div class="announcement-actions">
                                <button class="btn-icon edit" onclick="editAnnouncement('${announcement.id}')">
                                    <i class="fas fa-edit"></i>
                                </button>
                                <button class="btn-icon delete" onclick="deleteAnnouncement('${announcement.id}')">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </div>
                        </div>
                        <h3 class="announcement-title">${announcement.title}</h3>
                        <div class="announcement-content">
                            ${announcement.content}
                        </div>
                        <div class="announcement-footer">
                            <div class="announcement-date">
                                <i class="far fa-calendar"></i>
                                ${announcement.startDate.toLocaleDateString()} - ${announcement.endDate.toLocaleDateString()}
                            </div>
                            <span class="announcement-status ${statusClass}">
                                <i class="fas fa-circle"></i>
                                ${statusText}
                            </span>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Get icon for announcement type
        function getTypeIcon(type) {
            switch(type) {
                case 'warning': return 'exclamation-triangle';
                case 'urgent': return 'exclamation-circle';
                case 'success': return 'check-circle';
                default: return 'info-circle';
            }
        }

        // Open Modal
        function openModal(announcementId = null) {
            const modal = document.getElementById('announcementModal');
            const title = document.getElementById('modalTitle');
            const form = document.getElementById('announcementForm');
            
            currentAnnouncementId = announcementId;
            
            if (announcementId) {
                title.textContent = 'Edit Announcement';
                const announcement = announcements.find(a => a.id === announcementId);
                if (announcement) {
                    document.getElementById('announcementId').value = announcement.id;
                    document.getElementById('title').value = announcement.title;
                    document.getElementById('type').value = announcement.type || 'info';
                    document.getElementById('status').value = announcement.status || 'active';
                    document.getElementById('startDate').value = formatDateForInput(announcement.startDate);
                    document.getElementById('endDate').value = formatDateForInput(announcement.endDate);
                    document.getElementById('content').value = announcement.content;
                    
                    // Handle audience selection
                    const audienceSelect = document.getElementById('audience');
                    const audience = announcement.audience || [];
                    Array.from(audienceSelect.options).forEach(option => {
                        option.selected = audience.includes(option.value);
                    });
                }
            } else {
                title.textContent = 'New Announcement';
                form.reset();
                
                // Set default dates
                const today = new Date();
                const nextWeek = new Date();
                nextWeek.setDate(today.getDate() + 7);
                
                document.getElementById('startDate').value = formatDateForInput(today);
                document.getElementById('endDate').value = formatDateForInput(nextWeek);
            }
            
            modal.classList.add('active');
        }

        // Format date for input field
        function formatDateForInput(date) {
            const d = new Date(date);
            return d.toISOString().split('T')[0];
        }

        // Close Modal
        function closeModal() {
            document.getElementById('announcementModal').classList.remove('active');
            document.getElementById('announcementForm').reset();
            currentAnnouncementId = null;
        }

        // Edit Announcement
        function editAnnouncement(id) {
            openModal(id);
        }

        // Delete Announcement
        async function deleteAnnouncement(id) {
            if (!confirm('Are you sure you want to delete this announcement?')) {
                return;
            }
            
            try {
                await deleteDoc(doc(db, 'announcements', id));
                showSuccess('Announcement deleted successfully');
                loadAnnouncements();
            } catch (error) {
                console.error('Error deleting announcement:', error);
                showError('Failed to delete announcement');
            }
        }

        // Save Announcement
        document.getElementById('announcementForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const announcementData = {
                title: document.getElementById('title').value.trim(),
                type: document.getElementById('type').value,
                status: document.getElementById('status').value,
                startDate: Timestamp.fromDate(new Date(document.getElementById('startDate').value)),
                endDate: Timestamp.fromDate(new Date(document.getElementById('endDate').value)),
                content: document.getElementById('content').value.trim(),
                audience: Array.from(document.getElementById('audience').selectedOptions).map(opt => opt.value),
                updatedAt: Timestamp.now()
            };
            
            if (!announcementData.title || !announcementData.content) {
                showError('Title and content are required');
                return;
            }
            
            if (announcementData.startDate > announcementData.endDate) {
                showError('End date must be after start date');
                return;
            }
            
            try {
                if (currentAnnouncementId) {
                    // Update existing
                    await updateDoc(doc(db, 'announcements', currentAnnouncementId), announcementData);
                    showSuccess('Announcement updated successfully');
                } else {
                    // Add new
                    announcementData.createdAt = Timestamp.now();
                    announcementData.createdBy = auth.currentUser.uid;
                    await addDoc(collection(db, 'announcements'), announcementData);
                    showSuccess('Announcement created successfully');
                }
                
                closeModal();
                loadAnnouncements();
            } catch (error) {
                console.error('Error saving announcement:', error);
                showError('Failed to save announcement: ' + error.message);
            }
        });

        // Utility Functions
        function showSuccess(message) {
            alert(message);
        }

        function showError(message) {
            alert('Error: ' + message);
        }

        // Logout Functionality
        document.addEventListener('DOMContentLoaded', () => {
            const logoutBtn = document.getElementById('logoutBtn');
            if (logoutBtn) {
                logoutBtn.addEventListener('click', () => {
                    localStorage.clear();
                    window.location.href = 'index.html';
                });
            }
        });

        // Search Functionality
        function searchAnnouncements(searchTerm) {
            const filtered = announcements.filter(announcement => 
                announcement.title.toLowerCase().includes(searchTerm.toLowerCase()) ||
                announcement.content.toLowerCase().includes(searchTerm.toLowerCase()) ||
                announcement.type.toLowerCase().includes(searchTerm.toLowerCase())
            );
            displayAnnouncements(filtered);
        }

        // Add search input dynamically
        document.addEventListener('DOMContentLoaded', () => {
            const topbarRight = document.querySelector('.topbar-right');
            if (topbarRight) {
                const searchInput = document.createElement('input');
                searchInput.type = 'text';
                searchInput.placeholder = 'Search announcements...';
                searchInput.style.padding = '10px 16px';
                searchInput.style.borderRadius = '8px';
                searchInput.style.border = '2px solid var(--border)';
                searchInput.style.marginRight = '10px';
                searchInput.style.width = '200px';
                searchInput.addEventListener('input', (e) => {
                    searchAnnouncements(e.target.value);
                });
                topbarRight.insertBefore(searchInput, topbarRight.firstChild);
            }
        });
    </script>
</body>
</html>
